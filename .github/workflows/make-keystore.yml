name: Genera keystore di debug (una tantum)

# Genera UN keystore di debug stabile e lo pubblica come artifact.
# Serve una sola volta: si scarica l'artifact e si committa in app-mobile/keystore/
# così tutte le build APK firmano con la STESSA chiave e gli aggiornamenti funzionano.
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Genera debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Pubblica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error
