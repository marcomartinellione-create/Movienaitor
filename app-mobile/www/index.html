<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a0c">
<title>Movienaitor</title>
<link rel="icon" href="icon.svg">

<style>
  :root{
    --bg:#140a0c; --bg2:#1c1113; --card:#241619; --linea:#3a2226;
    --oro:#c9a45c; --oro2:#e6c583; --rosso:#7a1f1f; --rosso2:#c0504d;
    --testo:#f3e9e0; --dim:#b39a92; --ok:#7d9b76;
    --su-oro:#231208;      /* testo scuro sopra i fondi oro */
    --sel:#2a1b16;         /* fondo delle voci scelte (chip, poltrone, tab) */
    --velo-badge:#000c;    /* fondo dei badge sopra le locandine */
    --rapida:.15s;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  /* messa a fuoco visibile (tastiera esterna / navigazione) */
  :focus-visible{outline:2px solid var(--oro); outline-offset:2px}
  /* caselle di spunta in tinta col velluto invece del bianco di sistema */
  input[type=checkbox]{appearance:none; -webkit-appearance:none; width:18px; height:18px; flex:none;
    border:1px solid var(--oro); border-radius:5px; background:var(--bg2); margin:0;
    display:inline-grid; place-content:center}
  input[type=checkbox]:checked{background:var(--oro); border-color:var(--oro)}
  input[type=checkbox]:checked::after{content:'✓'; color:var(--su-oro); font-size:13px; font-weight:700; line-height:1}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #26141a 0%, var(--bg) 60%);
    color:var(--testo); font:14px/1.36 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px; margin:0 auto; padding:10px 12px 74px}
  h1{font-size:18px; letter-spacing:.06em; margin:0; color:var(--oro2)}
  h1 .c{color:var(--rosso2)}
  .sub{color:var(--dim); font-size:12px; margin:1px 0 0}

  header{display:flex; align-items:center; gap:8px; padding:8px 11px; border-bottom:1px solid var(--linea); position:sticky; top:0; background:linear-gradient(#140a0cf2,#140a0cd0); backdrop-filter:blur(6px); z-index:5}
  header img{width:28px; height:28px; border-radius:7px}
  header .chi{margin-left:auto; font-size:12px; color:var(--dim); text-align:right; line-height:1.2}
  header .chi b{color:var(--oro2); display:block}
  header .cambia{margin-left:2px; font-size:18px; background:none; padding:5px}

  .schermo{display:none}
  .schermo.on{display:block}

  .centro{min-height:70dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:20px}
  .bollo{font-size:52px}

  button{font:inherit; cursor:pointer; border:0; border-radius:11px; padding:11px 15px; color:var(--testo); background:var(--card); transition:var(--rapida)}
  button:active{transform:scale(.97)}
  .primario{background:linear-gradient(180deg,var(--rosso2),var(--rosso)); color:#fff; font-weight:600; box-shadow:0 6px 18px #0006}
  .oro{background:linear-gradient(180deg,var(--oro2),var(--oro)); color:var(--su-oro); font-weight:700}
  .ghost{background:transparent; border:1px solid var(--linea); color:var(--dim)}
  .grande{width:100%; max-width:340px; padding:16px}
  .linkbtn{background:none; padding:8px; color:var(--dim); text-decoration:underline; font-size:13px}

  .campo{width:100%; max-width:340px; background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:12px; padding:14px; font:inherit; text-align:center}
  .campo:focus{outline:0; border-color:var(--oro)}

  .lista-profili{display:flex; flex-direction:column; gap:10px; width:100%; max-width:360px}
  .prof{display:flex; align-items:center; gap:12px; text-align:left; width:100%}
  .pallino{width:26px; height:26px; border-radius:50%; flex:0 0 auto; box-shadow:inset 0 0 0 2px #0004}

  .cerca{display:flex; gap:8px; margin:2px 0 10px}
  .cerca input{flex:1; background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:11px; padding:11px 12px; font:inherit}
  .cerca input:focus{outline:0; border-color:var(--oro)}

  .film{display:flex; gap:9px; align-items:center; background:var(--card); border:1px solid var(--linea); border-radius:12px; padding:7px 8px; margin-bottom:7px}
  .film .pst{width:42px; height:63px; border-radius:7px; object-fit:cover; background:var(--bg2); flex:0 0 auto}
  .film .info{flex:1; min-width:0}
  .film .tit{font-weight:600; line-height:1.15; font-size:14px}
  .film .meta{color:var(--dim); font-size:11.5px; margin-top:1px}
  .film .az{flex:0 0 auto}
  .tondo{width:38px; height:38px; border-radius:50%; padding:0; font-size:19px; display:grid; place-items:center}

  .sezione{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; margin:12px 2px 7px}
  .sezione .grow{flex:1}
  .vuoto{color:var(--dim); text-align:center; padding:20px; font-size:13px}
  .stelle{color:var(--oro); letter-spacing:1px; font-size:12px}
  .film.cliccabile{cursor:pointer}
  .film .chevron{color:var(--dim); font-size:18px; padding:0 3px}

  /* barra filtri (bottom sheet) */
  .f-btn{background:var(--bg2); border:1px solid var(--linea); color:var(--dim); border-radius:999px; padding:5px 11px; font-size:11.5px; letter-spacing:.06em}
  .f-btn.attivo{border-color:var(--oro); color:var(--oro2)}
  .campo-r{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0}
  .campo-r label{color:var(--dim); font-size:13px}
  .inp{background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:9px; padding:9px 10px; font:inherit; font-size:13px}
  select.inp{min-width:130px}

  .compagnia{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px}
  .pchip{font-size:12.5px; padding:7px 11px; border-radius:999px; border:1px solid var(--linea); background:var(--bg2); color:var(--dim)}
  .pchip.con{border-color:var(--ok); color:#d3e8cc; background:#20301c}
  .pchip.non{border-color:var(--rosso2); color:#f2cecc; background:#331919}
  .etich{font-size:12px; letter-spacing:.12em; color:var(--dim); margin-top:12px}
  .etich.sotto{font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin:8px 0 2px; color:var(--dim); opacity:.8}
  .pw-in{width:100%; background:var(--bg2); border:1px solid var(--linea); color:var(--testo); padding:12px; border-radius:10px; font:inherit; margin-top:8px}
  .pw-in:focus{outline:0; border-color:var(--oro)}

  .backdrop{position:fixed; inset:0; background:#000a; display:none; align-items:flex-end; justify-content:center; z-index:20}
  .backdrop.on{display:flex}
  .modale{background:var(--bg2); border-top:2px solid var(--oro); border-radius:18px 18px 0 0; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); animation:su .2s}
  @keyframes su{from{transform:translateY(30px)}}
  .modale h3{margin:0 0 4px}
  .modale .meta{color:var(--dim); font-size:13px}
  .trama{color:var(--dim); font-size:13.5px; margin:12px 0; max-height:120px; overflow:auto}
  .picker{display:flex; gap:6px; margin:12px 0}
  .picker .st{font-size:30px; color:var(--linea); cursor:pointer; line-height:1}
  .picker .st.on{color:var(--oro2)}
  .m-az{display:flex; gap:10px; margin-top:8px}
  .m-az button{flex:1}

  .toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#000d; color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; z-index:40; opacity:0; transition:.25s; max-width:90%; text-align:center; border:1px solid var(--linea)}
  .toast.on{opacity:1}
  .toast.err{border-color:var(--rosso2)}

  .spin{width:22px; height:22px; border:3px solid var(--linea); border-top-color:var(--oro); border-radius:50%; animation:g .8s linear infinite; display:inline-block; vertical-align:-4px}
  @keyframes g{to{transform:rotate(360deg)}}

  /* ── Recensioni (mobile) ── */
  .segmenti{display:flex; gap:5px; margin-bottom:12px; background:var(--bg2); border:1px solid var(--linea); border-radius:11px; padding:3px}
  .seg{flex:1; background:none; border:0; color:var(--dim); border-radius:8px; padding:8px; font-size:13px; font-weight:600}
  .seg.on{background:var(--card); color:var(--oro2)}
  .rec-utenti{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
  .rec-utente{display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--linea); background:none; color:var(--dim); font-size:12px}
  .rec-utente.on{border-color:var(--oro); color:var(--oro2)}
  .rec-utente .pallino2{width:11px; height:11px; border-radius:50%}
  .rec-bar{display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
  .rec-bar #m-rec-q{flex:1; min-width:110px; background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:9px; padding:8px 10px; font:inherit; font-size:13px}
  .rec-galleria{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px}
  .rec-card2{cursor:pointer; border-radius:10px; overflow:hidden; background:var(--card); border:1px solid var(--linea)}
  .rec-poster2{position:relative; aspect-ratio:2/3; background:var(--bg2)}
  .rec-poster2 img{width:100%; height:100%; object-fit:cover; display:block}
  .rec-poster2 .seg2{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:11px; color:var(--dim); padding:4px; line-height:1.3}
  .rec-voto-b{position:absolute; bottom:4px; left:4px; background:var(--velo-badge); color:var(--oro2); padding:2px 6px; border-radius:6px; font-size:11px; letter-spacing:1px}
  .rec-card2.in-corso{outline:2px solid var(--oro); outline-offset:-2px}
  .rec-incorso-b{position:absolute; top:4px; left:4px; background:var(--oro); color:var(--su-oro); font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px}
  .re-incorso2{display:inline-flex; align-items:center; gap:6px; color:var(--oro2); font-size:12.5px; border:1px solid var(--oro); border-radius:9px; padding:6px 10px}
  .re-incorso2 input{accent-color:var(--oro); width:15px; height:15px}
  .rec-card2 .corpo{padding:6px 7px}
  .rec-card2 h5{margin:0; font-size:12px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rec-card2 .sub2{color:var(--dim); font-size:10.5px; margin-top:1px}
  .rec-vuoto{grid-column:1/-1; color:var(--dim); text-align:center; padding:30px 16px; font-size:13px; line-height:1.6}
  .rec-visti{border:1px solid var(--linea); border-radius:11px; background:var(--bg2); margin-bottom:12px; padding:0 12px}
  .rec-visti summary{cursor:pointer; padding:10px 2px; color:var(--oro2); font-size:13px}
  .rec-visti[open] #m-rec-visti{padding:2px 0 12px; display:flex; flex-wrap:wrap; gap:7px}
  .rec-nr{background:var(--card); border:1px solid var(--linea); color:var(--testo); border-radius:8px; padding:6px 10px; font-size:12.5px}
  .re-head{display:flex; gap:11px; align-items:flex-start; margin-bottom:10px}
  .re-poster{width:70px; flex:0 0 auto; aspect-ratio:2/3; border-radius:8px; overflow:hidden; position:relative; background:var(--bg2)}
  .re-poster img{width:100%; height:100%; object-fit:cover}
  .re-stelle{display:inline-flex; gap:2px; cursor:pointer; font-size:27px; line-height:1}
  .re-stelle span{color:var(--linea)}
  .re-stelle span.piena{color:var(--oro2)}
  .re-stelle span.mezza{background:linear-gradient(90deg,var(--oro2) 50%, var(--linea) 50%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .re-voto-num{color:var(--dim); font-size:12.5px}
  .re-riga2{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0}
  .re-riga2 label{display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12.5px}
  .re-riga2 input{background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:8px; padding:7px 9px; font:inherit; font-size:13px}
  .re-riga2 input[type=text]{flex:1; min-width:120px}
  .re-sez{border:1px solid var(--linea); border-radius:10px; padding:10px; margin-bottom:12px; background:var(--bg2)}
  .re-sez-cap{display:flex; gap:6px; align-items:center; margin-bottom:6px}
  .re-sez-tit{flex:1; background:none; border:0; border-bottom:1px solid var(--linea); color:var(--oro2); font:inherit; font-weight:600; font-size:15px; padding:3px 2px}
  .re-sez-btn{display:flex; gap:2px}
  .re-sez-btn button{background:none; border:1px solid var(--linea); color:var(--dim); border-radius:6px; padding:3px 8px; font-size:13px}
  .re-sez-txt{width:100%; background:none; border:0; color:var(--testo); font:inherit; font-size:15px; line-height:1.6; resize:none; overflow:hidden; min-height:120px}
  .re-sez-ro{margin-bottom:14px}
  .re-sez-ro h4{margin:0 0 4px; color:var(--oro2); font-size:14px}
  .re-testo{color:var(--testo); font-size:14px; line-height:1.55; white-space:pre-wrap}
  .rn-item{display:flex; gap:9px; align-items:center; padding:8px 2px; border-bottom:1px solid var(--linea); cursor:pointer}
  .rn-item img{width:34px; height:51px; object-fit:cover; border-radius:5px}
  .rn-mini{width:34px; height:51px; background:var(--linea); border-radius:5px; flex:0 0 auto}
  .re-toolbar{display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin:2px 0 10px; padding:5px; border:1px solid var(--linea); border-radius:10px; background:var(--bg2); position:sticky; top:0; z-index:2}
  .re-toolbar button{background:var(--card); border:1px solid var(--linea); color:var(--testo); border-radius:7px; padding:5px 9px; font-size:14px; min-width:32px}
  .re-col{display:inline-flex; align-items:center; gap:3px; background:var(--card); border:1px solid var(--linea); border-radius:7px; padding:2px 6px; color:var(--testo); font-size:14px}
  .re-col input[type=color]{width:22px; height:22px; border:0; background:none; padding:0}
  .re-sez-txt[contenteditable]{overflow:visible}
  .re-sez-txt[contenteditable]:focus{outline:0}
  .re-sez-txt[contenteditable]:empty:before{content:attr(data-ph); color:var(--dim)}
  .re-sez-txt ul,.re-sez-txt ol,.re-testo ul,.re-testo ol{margin:6px 0 6px 22px}
  .re-sez-txt ul,.re-testo ul{list-style:disc} .re-sez-txt ol,.re-testo ol{list-style:decimal}
  .re-dove-file{display:flex; gap:8px; margin:8px 0}
  .re-dove-file input{flex:1; background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:9px; padding:8px 10px; font:inherit; font-size:13px}

  /* ── Sala (mobile) ── */
  .platea{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 8px; padding:12px 4px 6px; margin-bottom:2px;
    background:radial-gradient(65% 95% at 50% 0%, rgba(74,40,48,.22), transparent 72%); border-radius:16px}
  .poltrona{width:62px; text-align:center; padding-top:4px; transition:transform .12s}
  .poltrona.assegnata{cursor:pointer}
  .poltrona.assegnata:active{transform:translateY(-2px)}
  .poltrona svg{width:100%; display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .poltrona .nome{font-size:11px; color:var(--dim); margin-top:2px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .poltrona.presente .nome{color:var(--oro2)}
  .poltrona.vuota{opacity:.4; pointer-events:none}
  /* sotto-menù (Watch List: da vedere / già visti) */
  .sotto-menu{display:flex; gap:6px; margin:2px 0 10px}
  .smtab{flex:1; background:var(--bg2); border:1px solid var(--linea); color:var(--dim); border-radius:10px; padding:8px; font-size:13px; font-weight:600}
  .smtab.on{border-color:var(--oro); color:var(--oro2); background:var(--sel)}
  .smtab .n{opacity:.65; font-weight:400}
  .film .visto-tag{color:var(--ok)}
  /* schermo: stessa proporzione del desktop (16/9) + sipario animato */
  .cartellone{position:relative; border:3px double var(--oro); border-radius:12px; overflow:hidden; background:#120a0d; margin:10px 0 4px; aspect-ratio:16/9; box-shadow:0 0 40px rgba(201,164,92,.12)}
  .cartellone-inner{position:absolute; inset:0}
  .cartellone .sfondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.7}
  .cartellone .velo{position:absolute; inset:0; background:linear-gradient(180deg,#140a0c22 25%,#140a0cf0 88%)}
  .cartellone .dentro{position:absolute; inset:0; padding:12px 14px; display:flex; flex-direction:column; justify-content:flex-end; z-index:1}
  .cartellone .rango{position:absolute; top:6px; left:12px; font-size:24px; font-family:var(--serif,Georgia,serif); color:var(--oro2); text-shadow:0 1px 6px #000; z-index:2}
  .cartellone h4{margin:0; font-size:18px; line-height:1.15; color:var(--testo); text-shadow:0 1px 8px #000;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .cartellone .meta2{color:var(--dim); font-size:11.5px; margin-top:3px; text-shadow:0 1px 6px #000; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
  .cartellone .punti{color:var(--oro2)}
  .cartellone .msg{position:absolute; inset:0; display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; text-align:center; color:var(--dim); font-size:13px; padding:18px; line-height:1.55; z-index:6}
  /* sipario: tende chiuse di base, si aprono scorrendo quando c'è un film (.aperto) */
  .cartellone .tenda{position:absolute; top:-6px; bottom:-6px; width:54%; z-index:4; pointer-events:none;
    background:repeating-linear-gradient(90deg,#7a3838 0 10px,#5a282c 10px 20px);
    transition:transform .9s cubic-bezier(.55,.06,.3,1)}
  .cartellone .tenda.sx{left:-4px; box-shadow:inset -18px 0 28px rgba(0,0,0,.55)}
  .cartellone .tenda.dx{right:-4px; box-shadow:inset 18px 0 28px rgba(0,0,0,.55)}
  .cartellone.aperto .tenda.sx{transform:translateX(calc(-100% + 22px))}
  .cartellone.aperto .tenda.dx{transform:translateX(calc(100% - 22px))}
  /* tasto Play (registra la serata come sul desktop) */
  .cartellone .play{position:absolute; right:12px; bottom:12px; z-index:5; width:50px; height:50px; border-radius:50%; border:0;
    background:radial-gradient(circle at 35% 30%, var(--oro2), var(--oro) 70%, #8a7347); color:var(--su-oro); font-size:21px;
    box-shadow:0 5px 16px rgba(201,164,92,.45); display:grid; place-items:center; cursor:pointer}
  .cartellone .play:active{transform:scale(.93)}
  /* "si spengono le luci" dopo il Play */
  #m-luci{position:fixed; inset:0; background:#000; z-index:60; display:flex; flex-direction:column; gap:12px;
    align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--oro2); font-size:26px;
    opacity:0; pointer-events:none; transition:opacity .5s}
  #m-luci.giu{opacity:1; pointer-events:auto}
  #m-luci small{font-size:13px; color:var(--dim)}
  .film .rango2{flex:0 0 auto; width:20px; text-align:center; color:var(--oro2); font-size:16px}
  .stato-sala{color:var(--dim); font-size:11.5px; text-align:center; margin:10px 2px; line-height:1.5}
  .stato-sala .avv{color:var(--rosso2)}

  /* ── Segnalazioni (mobile) ── */
  .bug-btn{position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:15;
    display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px; font-size:12.5px;
    background:linear-gradient(180deg,#3a2226,#241619); border:1px solid var(--oro); color:var(--oro2); box-shadow:0 6px 18px #0008}
  .sg-tipi{display:flex; flex-direction:column; gap:7px; margin:8px 0 2px}
  .sg-tipo{display:block; text-align:left; padding:10px 12px; border-radius:11px; border:1px solid var(--linea); background:var(--bg2); color:var(--testo)}
  .sg-tipo.on{border-color:var(--oro); background:var(--sel)}
  .sg-tipo .lb{font-weight:600; font-size:13.5px}
  .sg-tipo .ds{display:block; color:var(--dim); font-size:11.5px; margin-top:2px; line-height:1.35}
  .sg-in{width:100%; background:var(--bg2); border:1px solid var(--linea); color:var(--testo); border-radius:10px; padding:11px; font:inherit; margin-top:6px}
  .sg-in:focus{outline:0; border-color:var(--oro)}
  textarea.sg-in{min-height:110px; resize:vertical; line-height:1.5}
  .sg-mia{display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--linea); font-size:12.5px; color:var(--dim)}

<script>
/* ══════════════════ STATO ══════════════════ */
const APP_VERSION = '1.4.4';
const CONFIG_DEFAULT = { bonusCoralita:0.10, capCoralita:0.30, passoSoddisfazione:0.15, bonusCoppia:1.15, sogliaSpareggio:0.02 };
const S = { treeUri:null, config:{}, profili:[], me:null, storico:[],
  filtri:{ q:'', ordina:'aggiunto', dir:'desc', minDes:0, genere:[], annoDa:null, annoA:null },
  recensioni:[], recUtente:null, recFiltri:{ q:'', ordina:'votoPersonale', dir:'desc' }, pan:'lista',
  listaVista:'daVedere',
  presenti:new Set(), fSala:{ durata:null, genere:[], regista:'' }, proiettato:null, tuttiSala:[],
  segnalazioni:[], segnStato:{}, segnEliminate:[], aggiornamento:null,
  providersCache:new Map() };   // tmdbId → [servizi streaming] da TMDB (sessione)
const SEZIONI_DEFAULT = ['Introduzione', 'Che ne penso', 'Momento preferito', 'Messaggio', 'A chi lo consiglio'];
const stelleLetterbox = v => { v = v||0; const p = Math.floor(v/2), m = (v%2)===1; return ('★'.repeat(p) + (m?'½':'')) || '—'; };
const GENERI_TMDB = ['Azione','Avventura','Animazione','Commedia','Crime','Documentario','Dramma','Famiglia','Fantasy','Storia','Horror','Musica','Mistero','Romance','Fantascienza','Film TV','Thriller','Guerra','Western'];
const filtriAttivi = () => { const f = S.filtri; return !!(f.q || f.minDes || f.genere.length || f.annoDa || f.annoA || f.ordina!=='aggiunto' || f.dir!=='desc'); };
// Migrazione dal vecchio modello Bonus Genere (bonusGenere+generiPreferiti) al nuovo (pos/neg per genere)
function migraGeneri(p){
  if (!p.generiPositivi && !p.generiNegativi && Array.isArray(p.generiPreferiti) && p.generiPreferiti.length){
    if (p.bonusGenere === 'neg') p.generiNegativi = p.generiPreferiti.slice();
    else if (p.bonusGenere !== 'neu') p.generiPositivi = p.generiPreferiti.slice();
  }
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = { get:k=>{try{return localStorage.getItem('mvna_'+k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem('mvna_'+k,v)}catch(e){}} };

function schermo(id){
  document.querySelectorAll('.schermo').forEach(s=>s.classList.remove('on'));
  $('#'+id).classList.add('on');
  $('#m-segnala').style.display = (id === 'sc-app') ? '' : 'none';   // solo dentro l'app
}
let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':''),2800); }
function apriModale(html){ $('#modale').innerHTML=html; $('#backdrop').classList.add('on'); }
function chiudiModale(){ $('#backdrop').classList.remove('on'); }
$('#backdrop').addEventListener('click', e=>{ if(e.target.id==='backdrop') chiudiModale(); });

const fmtMin = m => m ? Math.floor(m/60)+'h'+String(m%60).padStart(2,'0') : '—';
// data breve in formato europeo gg/mm/aaaa (deterministico)
const dataBreve = d => { d = String(d||'').slice(0,10); const m = d.match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : d; };
const stelle = n => '★★★★★☆☆☆☆☆'.slice(5-(n||0), 10-(n||0));

/* password profilo (come su PC: evita di entrare per sbaglio nel profilo altrui) */
function promptPassword(nome, onOk){
  apriModale(`<h3>Password di ${esc(nome)}</h3>
    <p class="meta">Questo profilo ha una password: serve solo a non entrare per sbaglio nel profilo di un altro.</p>
    <input type="password" class="pw-in" id="pw-in" autocomplete="off" spellcheck="false" inputmode="text">
    <div class="m-az">
      <button class="ghost" id="pw-annulla">Annulla</button>
      <button class="primario" id="pw-ok">🎟 Entra</button>
    </div>`);
  const vai = () => { const val = $('#pw-in').value; chiudiModale(); onOk(val); };
  $('#pw-annulla').onclick = chiudiModale;
  $('#pw-ok').onclick = vai;
  $('#pw-in').onkeydown = e => { if (e.key === 'Enter') vai(); };
  setTimeout(() => $('#pw-in').focus(), 40);
}

/* white/black list: chip a tre stati  neutro → ✓ con → ✗ non → neutro (identico al PC) */
function chipsCompagnia(voce){
  const altri = S.profili.filter(p => p.slug !== (S.me && S.me.slug));
  if (!altri.length) return '<span style="color:var(--dim); font-size:12px">nessun altro profilo</span>';
  return altri.map(p => {
    const stato = (voce.conChi||[]).includes(p.slug) ? 'con' : (voce.nonCon||[]).includes(p.slug) ? 'non' : '';
    const segno = stato === 'con' ? '✓ ' : stato === 'non' ? '✗ ' : '';
    return `<button class="pchip ${stato}" data-slug="${esc(p.slug)}">${segno}${esc(p.nome)}</button>`;
  }).join('');
}
function cicloCompagnia(voce, slug){
  voce.conChi = voce.conChi || []; voce.nonCon = voce.nonCon || [];
  if (voce.conChi.includes(slug)){ voce.conChi = voce.conChi.filter(x=>x!==slug); voce.nonCon.push(slug); }
  else if (voce.nonCon.includes(slug)){ voce.nonCon = voce.nonCon.filter(x=>x!==slug); }
  else voce.conChi.push(slug);
}

/* ══════════════════ CARTELLA DI SISTEMA (SAF, plugin nativo) ══════════════════ */
const saf = () => (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.MvnSaf) || null;
const inApp = () => !!saf();

async function pickFolder(){ const r = await saf().pickFolder(); return (r && r.uri) ? r.uri : null; }
async function fsLeggi(uri){ return (await saf().read({ uri })).data; }
async function fsScrivi(uri, str){ await saf().write({ uri, data: str }); }
// file per percorso relativo alla cartella del gruppo (es. 'segnalazioni/marco.json')
async function fsLeggiPercorso(percorso){
  try { const r = await saf().leggiPercorso({ uri:S.treeUri, percorso }); return r.data || null; }
  catch(e){ return null; }   // plugin vecchio o file assente
}
async function fsScriviPercorso(percorso, str){ await saf().scriviPercorso({ uri:S.treeUri, percorso, data:str }); }
async function fsElencaJson(cartella){
  try { return (await saf().elencaJson({ uri:S.treeUri, cartella })).files || []; }
  catch(e){ return []; }
}

/* ── Recensioni: strato dati (via plugin nativo SAF) ── */
async function caricaRecensioniMobile(){
  S.recensioni = [];
  try {
    const res = await saf().caricaRecensioni({ uri: S.treeUri });
    for (const f of (res.recensioni || [])){
      try { const r = JSON.parse(f.data);
        if (r && (r.meta || Array.isArray(r.sezioni) || r.tmdbId != null)){ r.autore = f.slug; r._uri = f.uri; r._nome = f.nome; S.recensioni.push(r); }
      } catch(e){}
    }
  } catch(e){ /* nessuna recensione o plugin vecchio: ignoro */ }
}
async function salvaRecensioneMobile(rec){
  rec.autore = S.me.slug;
  rec.modificato = new Date().toISOString();
  if (!rec.creato) rec.creato = new Date().toISOString().slice(0,10);
  const nome = (rec.tmdbId != null) ? rec.tmdbId + '.json' : (rec._nome || ('senza-id-' + Date.now() + '.json'));
  const vecchioUri = rec._uri, vecchioNome = rec._nome;
  const salvabile = {...rec}; delete salvabile._uri; delete salvabile._nome; delete salvabile.autore;
  const res = await saf().salvaRecensione({ uri: S.treeUri, slug: S.me.slug, nome, data: JSON.stringify(salvabile) });
  if (vecchioUri && vecchioNome && vecchioNome !== nome){ try { await saf().cancellaDoc({ uri: vecchioUri }); } catch(e){} }
  rec._uri = res.uri; rec._nome = res.nome || nome;
  const i = S.recensioni.findIndex(x => x.autore === S.me.slug && x._nome === rec._nome);
  if (i >= 0) S.recensioni[i] = rec; else S.recensioni.push(rec);
}
async function cancellaRecensioneMobile(rec){
  if (rec._uri) await saf().cancellaDoc({ uri: rec._uri });
  S.recensioni = S.recensioni.filter(x => !(x.autore === S.me.slug && x._nome === rec._nome));
}

/* ══════════════════ CARICAMENTO CARTELLA + PROFILI ══════════════════ */
async function caricaCartella(treeUri){
  const res = await saf().loadFolder({ uri: treeUri });   // { config, profili:[{name,uri,data}] }
  S.treeUri = treeUri;

  S.config = {};
  if (res.config){ try { S.config = JSON.parse(res.config); } catch(e){} }

  S.profili = [];
  for (const f of (res.profili || [])){
    try {
      const p = JSON.parse(f.data);
      if (p && p.slug && Array.isArray(p.lista)){ migraGeneri(p); p._uri = f.uri; S.profili.push(p); }
    } catch(e){}
  }
  S.profili.sort((a,b)=> (a.creato||'').localeCompare(b.creato||'') || a.slug.localeCompare(b.slug));

  S.storico = [];
  if (res.storico){ try { const st = JSON.parse(res.storico); if (Array.isArray(st.visioni)) S.storico = st.visioni; } catch(e){} }
  S.storico.sort((a,b)=> String(a.data||'').localeCompare(String(b.data||'')));
  await caricaRecensioniMobile();
  await caricaSegnalazioniM();
  controllaAggiornamento();   // non blocca l'avvio

  LS.set('tree', treeUri);
  disegnaProfili();
  $('#btn-indietro').style.display = 'none';
  schermo('sc-chi');
  // ricorda l'ultimo account: se è quello già sbloccato in passato, entra da solo senza
  // richiedere la password (si richiede solo al CAMBIO profilo). La password qui è solo
  // anti-errore (in chiaro nel JSON), quindi ricordare lo sblocco è accettabile.
  const ricordato = LS.get('me');
  if (ricordato && S.profili.some(p => p.slug === ricordato)){
    if (LS.get('sbloccato') === ricordato) entra(ricordato);
    else scegliProfilo(ricordato);
  }
}

function coloreDi(p, i){ return p.colore || ['#c9a45c','#9b7da8','#6f8fae','#7d9b76','#b0805a','#a85454'][i%6]; }
const coloreSlug = slug => { const i = S.profili.findIndex(p => p.slug === slug); return i < 0 ? '#c9a45c' : coloreDi(S.profili[i], i); };

// poltrona in velluto, identica al desktop (stesso SVG). f>0 schiarisce, f<0 scurisce.
function tinta(hex, f){
  const n = parseInt(String(hex).replace('#',''), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if (f >= 0){ r += (255-r)*f; g += (255-g)*f; b += (255-b)*f; }
  else { r *= (1+f); g *= (1+f); b *= (1+f); }
  const h = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#' + h(r) + h(g) + h(b);
}
let poltronaUid = 0;
function poltronaSVG(colore, presente){
  const uid = ++poltronaUid;
  const cuscino = presente ? colore : '#5a2830';
  const schienale = presente ? tinta(colore, -0.42) : '#4a2228';
  const braccioli = '#4a2228';
  return `<svg viewBox="0 0 100 88">
    <defs>
      <radialGradient id="mvnc${uid}" cx="50%" cy="32%" r="80%">
        <stop offset="0%" stop-color="${tinta(cuscino, 0.16)}"/>
        <stop offset="100%" stop-color="${tinta(cuscino, -0.14)}"/>
      </radialGradient>
      <linearGradient id="mvns${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${tinta(schienale, 0.14)}"/>
        <stop offset="100%" stop-color="${tinta(schienale, -0.2)}"/>
      </linearGradient>
    </defs>
    <g stroke="#201114" stroke-width="2.5" stroke-linejoin="round"${presente ? '' : ' opacity=".85"'}>
      <rect x="3" y="16" width="15" height="60" rx="7.5" fill="${braccioli}"/>
      <rect x="82" y="16" width="15" height="60" rx="7.5" fill="${braccioli}"/>
      <rect x="17" y="6" width="66" height="60" rx="14" fill="url(#mvnc${uid})"/>
      <rect x="24" y="13" width="52" height="46" rx="9" fill="none" stroke="${tinta(cuscino, -0.28)}" stroke-width="1.6" stroke-dasharray="3 4" opacity=".9"/>
      <rect x="13" y="58" width="74" height="24" rx="12" fill="url(#mvns${uid})"/>
    </g>
    ${presente ? `<g fill="#1b1013" stroke="${colore}" stroke-width="2.2" stroke-linejoin="round">
      <ellipse cx="50" cy="56" rx="24" ry="10.5"/>
      <circle cx="50" cy="48" r="11.5"/>
    </g>` : ''}
  </svg>`;
}
// platea mobile: una poltrona per profilo, a capo su più righe centrate; tocca per presente.
// Come sul desktop, si aggiungono poltrone vuote decorative per i posti/utenti futuri.
function disegnaPlateaM(){
  const box = $('#m-platea'); if (!box) return;
  const n = S.profili.length;
  const posti = Math.max(10, Math.ceil((n + 3) / 5) * 5);   // righe piene + qualche posto libero
  let html = S.profili.map((p,i) => {
    const presente = S.presenti.has(p.slug);
    return `<div class="poltrona assegnata${presente?' presente':''}" data-slug="${esc(p.slug)}">
      ${poltronaSVG(coloreDi(p,i), presente)}
      <div class="nome">${esc(p.nome)}</div>
    </div>`;
  }).join('');
  for (let i = n; i < posti; i++)
    html += `<div class="poltrona vuota">${poltronaSVG('#000', false)}<div class="nome">&nbsp;</div></div>`;
  box.innerHTML = html;
  box.querySelectorAll('.poltrona.assegnata').forEach(el => el.onclick = () => {
    const s = el.dataset.slug;
    if (S.presenti.has(s)) S.presenti.delete(s); else S.presenti.add(s);
    S.proiettato = null;
    disegnaSalaM();
  });
}

function disegnaProfili(){
  const box = $('#lista-profili');
  if (!S.profili.length){
    box.innerHTML = '<div class="vuoto">Nessun profilo in questa cartella.<br>Verifica di aver indicato la cartella giusta, o crea il tuo profilo dal PC.</div>';
    return;
  }
  box.innerHTML = S.profili.map((p,i)=>`
    <button class="prof ghost" data-slug="${esc(p.slug)}">
      <span class="pallino" style="background:${esc(coloreDi(p,i))}"></span>
      <span style="flex:1">${p.password ? '🔒 ' : ''}${esc(p.nome)}</span>
      <span style="color:var(--dim); font-size:12px">${(p.lista||[]).length} film</span>
    </button>`).join('');
  box.querySelectorAll('.prof').forEach(b => b.onclick = () => scegliProfilo(b.dataset.slug));
}

function scegliProfilo(slug){
  const p = S.profili.find(x => x.slug === slug);
  if (!p) return;
  if (p.password) promptPassword(p.nome, val => { if (val === p.password) entra(slug); else toast('Password errata', true); });
  else entra(slug);
}

function entra(slug){
  S.me = S.profili.find(p => p.slug === slug);
  if (!S.me) return;
  LS.set('me', slug);
  LS.set('sbloccato', slug);   // d'ora in poi si entra diretto; la password si richiede solo al cambio
  S.listaVista = 'daVedere';
  if (!S.config.tmdbKey) toast('Manca la chiave TMDB in config.json (si imposta dal PC).', true);
  $('#hdr').style.display = 'flex';
  $('#hdr-chi').innerHTML = 'sei<b>'+esc(S.me.nome)+'</b>';
  $('#q').value = ''; $('#risultati').innerHTML = '';
  disegnaMiaLista();
  S.presenti = new Set([slug]); S.proiettato = null;
  S.recUtente = null; setPan('lista');
  schermo('sc-app');
}

/* ══════════════════ TMDB (identico al PC) ══════════════════ */
async function cercaFilm(q){
  const k = S.config.tmdbKey; if (!k) throw new Error('nokey');
  const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${k}&language=it-IT&include_adult=false&query=${encodeURIComponent(q)}`);
  if (!r.ok) throw new Error('tmdb '+r.status);
  return ((await r.json()).results || []).slice(0, 10);
}
async function dettagliFilm(id){
  const k = S.config.tmdbKey;
  const r = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${k}&language=it-IT&append_to_response=credits,external_ids`);
  if (!r.ok) throw new Error('tmdb '+r.status);
  const j = await r.json();
  const regista = ((j.credits||{}).crew||[]).filter(c=>c.job==='Director').map(c=>c.name).join(', ');
  let voto = j.vote_average ? Math.round(j.vote_average*10)/10 : null, votoFonte = 'tmdb';
  const imdbId = (j.external_ids||{}).imdb_id || j.imdb_id;
  if (S.config.omdbKey && imdbId){
    try { const o = await (await fetch(`https://www.omdbapi.com/?apikey=${S.config.omdbKey}&i=${imdbId}`)).json();
      const iv = parseFloat(o.imdbRating); if (iv){ voto = iv; votoFonte = 'imdb'; } } catch(e){}
  }
  return {
    tmdbId:j.id, titolo:j.title || j.original_title, anno:(j.release_date||'').slice(0,4),
    uscita:j.release_date || null,
    collezione:j.belongs_to_collection ? j.belongs_to_collection.id : null,
    collezioneNome:j.belongs_to_collection ? j.belongs_to_collection.name : null,
    durata:j.runtime || null, regista, generi:(j.genres||[]).map(x=>x.name),
    paese:(j.production_countries||[]).map(c=>c.name).join(', '),
    cast:((j.credits||{}).cast||[]).slice(0,6).map(c=>c.name),
    voto, votoFonte, trama:j.overview || '',
    posterUrl:j.poster_path ? 'https://image.tmdb.org/t/p/w500'+j.poster_path : null,
    sfondoUrl:j.backdrop_path ? 'https://image.tmdb.org/t/p/w780'+j.backdrop_path : null,
    locandina:j.poster_path ? `posters/${j.id}.jpg` : null,
    sfondo:j.backdrop_path ? `posters/${j.id}_b.jpg` : null
  };
}
// Servizi streaming dove è disponibile il film (flatrate = abbonamento, regione IT),
// da TMDB watch/providers. Nomi TMDB → etichette nostre (DOVE_STREAMING). Cache in sessione.
const PROVIDER_ALIAS = {
  'Netflix':'Netflix', 'Netflix basic with Ads':'Netflix',
  'Amazon Prime Video':'Prime Video', 'Amazon Video':'Prime Video',
  'Disney Plus':'Disney+', 'NOW':'NOW', 'Now TV':'NOW',
  'Sky Go':'Sky', 'Apple TV Plus':'Apple TV+', 'Apple TV':'Apple TV+',
  'RaiPlay':'RaiPlay', 'Mediaset Infinity':'Mediaset Infinity', 'Infinity+':'Mediaset Infinity',
  'YouTube':'YouTube', 'Crunchyroll':'Crunchyroll', 'Paramount Plus':'Paramount+',
  'Paramount+ with Showtime':'Paramount+', 'Mubi':'Mubi', 'Timvision':'TIMVISION'
};
const normProvider = nome => PROVIDER_ALIAS[nome] || nome;
async function providersFilm(tmdbId){
  if (!tmdbId || !S.config.tmdbKey) return [];
  if (S.providersCache.has(tmdbId)) return S.providersCache.get(tmdbId);
  let out = [];
  try {
    const r = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/watch/providers?api_key=${S.config.tmdbKey}`);
    if (r.ok){
      const it = ((await r.json()).results || {}).IT || {};
      out = [...new Set((it.flatrate || []).map(p => normProvider(p.provider_name)))];
    }
  } catch(e){}
  S.providersCache.set(tmdbId, out);
  return out;
}

/* ══════════════════ RICERCA + RISULTATI ══════════════════ */
let cercaSeq = 0, cercaTimer = null;
function programmaRicerca(){
  clearTimeout(cercaTimer);
  const q = $('#q').value.trim();
  if (q.length < 2){ ++cercaSeq; $('#risultati').innerHTML = ''; return; }
  cercaTimer = setTimeout(eseguiRicerca, 320);
}
async function eseguiRicerca(){
  const q = $('#q').value.trim();
  const box = $('#risultati');
  if (q.length < 2){ box.innerHTML = ''; return; }
  const mio = ++cercaSeq;
  box.innerHTML = '<div class="vuoto"><span class="spin"></span> cerco…</div>';
  try {
    const res = await cercaFilm(q);
    if (mio !== cercaSeq) return;   // arrivata una ricerca più recente: scarto questa
    if (!res.length){ box.innerHTML = '<div class="vuoto">Nessun risultato.</div>'; return; }
    const idsInLista = new Set((S.me.lista||[]).map(v=>v.tmdbId));
    box.innerHTML = res.map(f=>{
      const pst = f.poster_path ? 'https://image.tmdb.org/t/p/w185'+f.poster_path : '';
      const anno = (f.release_date||'').slice(0,4);
      const gia = idsInLista.has(f.id);
      return `<div class="film">
        ${pst ? `<img class="pst" src="${pst}" loading="lazy" alt="">` : '<div class="pst"></div>'}
        <div class="info"><div class="tit">${esc(f.title)}</div><div class="meta">${esc(anno)}</div></div>
        <div class="az">${gia
          ? '<button class="tondo ghost" disabled title="già nella lista">✓</button>'
          : `<button class="tondo oro" data-add="${f.id}">＋</button>`}</div>
      </div>`;
    }).join('');
    box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => modaleAggiungi(parseInt(b.dataset.add,10)));
  } catch(e){
    if (mio !== cercaSeq) return;
    box.innerHTML = `<div class="vuoto">Ricerca non riuscita: ${esc(e.message==='nokey'?'manca la chiave TMDB in config.json':e.message)}</div>`;
  }
}

    <div class="etich">CON CHI / NON CON <span style="color:var(--dim);letter-spacing:0">— tocca: ✓ con · ✗ non</span></div>
    <div class="compagnia" id="chips">${chipsCompagnia(comp)}</div>
    <div class="m-az">
      <button class="ghost" id="m-annulla">Annulla</button>
      <button class="primario" id="m-ok">🎬 Aggiungi</button>
    </div>`);
  const dip = () => $('#stelle').querySelectorAll('.st').forEach(s => s.classList.toggle('on', +s.dataset.v <= desiderio));
  $('#stelle').onclick = e => { const s = e.target.closest('.st'); if(!s) return; desiderio = +s.dataset.v; dip(); };
  $('#chips').onclick = e => { const c = e.target.closest('.pchip'); if(!c) return; cicloCompagnia(comp, c.dataset.slug); $('#chips').innerHTML = chipsCompagnia(comp); };
  $('#m-annulla').onclick = chiudiModale;
  $('#m-ok').onclick = async () => {

    const voce = { ...d, desiderio, conChi:comp.conChi, nonCon:comp.nonCon, aggiunto: new Date().toISOString() };

  };
}

/* ══════════════════ SCRITTURA SICURA (rileggo prima di scrivere) ══════════════════ */
async function mutaLista(fn){
  const fresh = JSON.parse(await fsLeggi(S.me._uri));
  fresh.lista = fresh.lista || [];
  fn(fresh);
  await fsScrivi(S.me._uri, JSON.stringify(fresh));
  fresh._uri = S.me._uri;
  S.me = fresh;
  const i = S.profili.findIndex(p => p.slug === fresh.slug);
  if (i >= 0) S.profili[i] = fresh;
}
// scrittura generica del profilo (es. Bonus Genere): rilegge fresco, applica, riscrive
async function mutaProfilo(fn){
  const fresh = JSON.parse(await fsLeggi(S.me._uri));
  fn(fresh);
  await fsScrivi(S.me._uri, JSON.stringify(fresh));
  fresh._uri = S.me._uri;
  S.me = fresh;
  const i = S.profili.findIndex(p => p.slug === fresh.slug);
  if (i >= 0) S.profili[i] = fresh;
}

/* ══════════════════ FILTRI CATALOGO (stessa logica del desktop) ══════════════════ */
function filtraCatalogo(lista){
  const f = S.filtri;
  let out = lista.filter(v => {
    if (f.q && !String(v.titolo||'').toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.minDes && (v.desiderio||3) < f.minDes) return false;
    if (f.genere.length && !(v.generi||[]).some(g => f.genere.includes(g))) return false;
    const anno = parseInt(v.anno,10) || 0;
    if (f.annoDa && anno && anno < f.annoDa) return false;
    if (f.annoA && anno && anno > f.annoA) return false;
    return true;
  });
  const cmp = {
    titolo: (a,b)=> String(a.titolo||'').localeCompare(String(b.titolo||'')),
    anno: (a,b)=> (parseInt(a.anno,10)||0)-(parseInt(b.anno,10)||0),
    desiderio: (a,b)=> (a.desiderio||3)-(b.desiderio||3),
    voto: (a,b)=> (a.voto||0)-(b.voto||0),
    aggiunto: (a,b)=> String(a.aggiunto||'').localeCompare(String(b.aggiunto||''))
  }[f.ordina] || ((a,b)=>0);
  out.sort((a,b)=> cmp(a,b) || String(a.titolo||'').localeCompare(String(b.titolo||'')));
  if (f.dir==='desc') out.reverse();
  return out;
}

// data dell'ultima visione di un film per l'utente corrente (per la sezione "già visti")
function ultimaVisioneMia(tmdbId){
  let d = '';
  for (const v of S.storico)
    if (v.tmdbId === tmdbId && (v.partecipanti||[]).includes(S.me.slug) && String(v.data||'') > d) d = v.data;
  return d;
}
function disegnaMiaLista(){
  const tutte = (S.me.lista||[]).slice();
  // una voce è "da vedere" se non c'è una visione mia successiva all'aggiunta, altrimenti "già vista"
  const daVedere = tutte.filter(v => entryAttiva(v, S.me.slug));
  const visti = tutte.filter(v => !entryAttiva(v, S.me.slug));
  if ($('#m-conta-dav')) $('#m-conta-dav').textContent = daVedere.length ? '('+daVedere.length+')' : '';
  if ($('#m-conta-vis')) $('#m-conta-vis').textContent = visti.length ? '('+visti.length+')' : '';
  $$('#m-lista-tabs .smtab').forEach(b => b.classList.toggle('on', b.dataset.vista === S.listaVista));

  const sonoVisti = S.listaVista === 'visti';
  const base = sonoVisti ? visti : daVedere;
  const lista = filtraCatalogo(base);
  $('#conta-lista').textContent = base.length ? (lista.length===base.length ? '· '+base.length : '· '+lista.length+'/'+base.length) : '';
  const fb = $('#btn-filtri'); if (fb) fb.classList.toggle('attivo', filtriAttivi());
  const box = $('#mia-lista');
  if (!tutte.length){ box.innerHTML = '<div class="vuoto">Ancora nessun film. Cerca qui sopra e aggiungi il primo 🎬</div>'; return; }
  if (!base.length){ box.innerHTML = `<div class="vuoto">${sonoVisti ? 'Ancora nessun film già visto in questa lista.' : 'Niente da vedere: sono già stati visti tutti 🎉'}</div>`; return; }
  if (!lista.length){ box.innerHTML = '<div class="vuoto">Nessun film corrisponde ai filtri.</div>'; return; }
  box.innerHTML = lista.map(v=>{
    const pst = v.posterUrl || '';
    const comp = [ ...(v.conChi||[]).map(s=>'✓'+nomeDi(s)), ...(v.nonCon||[]).map(s=>'✗'+nomeDi(s)) ].join(' · ');
    const vis = sonoVisti ? ultimaVisioneMia(v.tmdbId) : '';
    return `<div class="film cliccabile" data-edit="${v.tmdbId}">
      ${pst ? `<img class="pst" src="${esc(pst)}" loading="lazy" alt="">` : '<div class="pst"></div>'}
      <div class="info">
        <div class="tit">${esc(v.titolo)}</div>
        <div class="meta">${esc(v.anno||'')}${v.durata?' · '+fmtMin(v.durata):''}</div>
        <div class="stelle">${sonoVisti
          ? `<span class="visto-tag">👁 visto${vis ? ' il '+esc(dataBreve(vis)) : ''}</span>`
          : stelle(v.desiderio)}${comp?` <span style="color:var(--dim)">· ${esc(comp)}</span>`:''}</div>
      </div>
      <div class="chevron">›</div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => modaleModifica(parseInt(b.dataset.edit,10)));
}

  const comp = { conChi:[...(orig.conChi||[])], nonCon:[...(orig.nonCon||[])] };
  apriModale(`
    <h3>${esc(orig.titolo)}</h3>
    <div class="meta">${esc(orig.anno||'')}${orig.durata?' · '+fmtMin(orig.durata):''}${orig.regista?' · '+esc(orig.regista):''}</div>
    ${visto ? `
    <div class="etich" style="margin-top:12px">GIÀ VISTO IN SALA</div>
    <p class="meta" style="line-height:1.6">Questo film è già stato visto in una serata. Puoi <b>rimetterlo in lista</b> se vuoi rivederlo, oppure toglierlo.</p>
    <div class="m-az">
      <button class="ghost" id="m-togli" style="color:var(--rosso2);border-color:var(--rosso2)">🗑 Rimuovi</button>
      <button class="primario" id="m-rivedi">↺ Rimetti in lista</button>

    <div class="etich">QUANTO VUOI VEDERLO</div>
    <div class="picker" id="stelle">${[1,2,3,4,5].map(n=>`<span class="st${n<=desiderio?' on':''}" data-v="${n}">★</span>`).join('')}</div>
    <div class="etich">CON CHI / NON CON <span style="color:var(--dim);letter-spacing:0">— tocca: ✓ con · ✗ non</span></div>
    <div class="compagnia" id="chips">${chipsCompagnia(comp)}</div>
    <div class="m-az">
      <button class="ghost" id="m-togli" style="color:var(--rosso2);border-color:var(--rosso2)">🗑 Rimuovi</button>
      <button class="primario" id="m-salva">Salva</button>
    </div>`}`);
  if (visto){
    $('#m-rivedi').onclick = async () => {
      $('#m-rivedi').disabled=true; $('#m-rivedi').innerHTML='<span class="spin"></span>';
      try {
        // aggiornando "aggiunto" la voce torna "da vedere" (le visioni precedenti non contano più)
        await mutaLista(p => { const vv = (p.lista||[]).find(x=>x.tmdbId===id); if(vv) vv.aggiunto = new Date().toISOString(); });
        chiudiModale(); S.listaVista = 'daVedere'; disegnaMiaLista();
        toast(`«${orig.titolo}» di nuovo in lista ↺`);
      } catch(e){ $('#m-rivedi').disabled=false; $('#m-rivedi').textContent='↺ Rimetti in lista'; toast('Non riuscito: '+e.message, true); }
    };
  } else {
    $('#stelle').onclick = e => { const s = e.target.closest('.st'); if(!s) return; desiderio = +s.dataset.v; $('#stelle').querySelectorAll('.st').forEach(x=>x.classList.toggle('on', +x.dataset.v<=desiderio)); };
    $('#chips').onclick = e => { const c = e.target.closest('.pchip'); if(!c) return; cicloCompagnia(comp, c.dataset.slug); $('#chips').innerHTML = chipsCompagnia(comp); };
    $('#m-salva').onclick = async () => {
      $('#m-salva').disabled=true; $('#m-salva').innerHTML='<span class="spin"></span>';
      try {
        await mutaLista(p => { const vv = (p.lista||[]).find(x=>x.tmdbId===id); if(vv){ vv.desiderio=desiderio; vv.conChi=comp.conChi; vv.nonCon=comp.nonCon; } });
        chiudiModale(); disegnaMiaLista();
        toast('Modifiche salvate ✓');
      } catch(e){ $('#m-salva').disabled=false; $('#m-salva').textContent='Salva'; toast('Non riuscito: '+e.message, true); }
    };
  }
  $('#m-togli').onclick = () => {
    apriModale(`<h3>Togliere dalla lista?</h3><p class="meta">«${esc(orig.titolo)}» sparirà dalla tua lista.</p>
      <div class="m-az"><button class="ghost" id="m-no">Annulla</button><button class="primario" id="m-si">Rimuovi</button></div>`);
    $('#m-no').onclick = () => modaleModifica(id);
    $('#m-si').onclick = async () => {

      try {
        await mutaLista(p => { p.lista = (p.lista||[]).filter(x=>x.tmdbId!==id); });
        chiudiModale(); disegnaMiaLista(); eseguiRicerca();
        toast(`«${orig.titolo}» tolto`);
      } catch(e){ $('#m-si').disabled=false; $('#m-si').textContent='Rimuovi'; toast('Non riuscito: '+e.message, true); }
    };
  };
}

/* ══════════════════ SALA — stessa logica del desktop (SPECIFICA §6-8) ══════════════════ */
const cfgSala = () => ({ ...CONFIG_DEFAULT, ...(S.config||{}) });
const ordineSaga = f => f.uscita || (f.anno ? f.anno + '-00-00' : '9999');
// una voce è ancora "da vedere" se non c'è una visione di quel film, con quella persona,
// successiva al momento in cui l'ha aggiunta (così «rimettilo in lista» funziona subito)
function entryAttiva(voce, slug){
  const aggiunto = voce.aggiunto || '0000-01-01';
  return !S.storico.some(v => v.tmdbId === voce.tmdbId && (v.partecipanti||[]).includes(slug)
    && (v.ts || v.data + 'T23:59:59') >= aggiunto);
}
function indiceSoddisfazione(slug){
  const passo = cfgSala().passoSoddisfazione;
  let idx = 1.0;
  for (const v of S.storico){
    if (!(v.partecipanti || []).includes(slug)) continue;
    if ((v.proponenti || []).includes(slug)){ if (idx > 1) idx = 1; idx = Math.max(0.5, idx - passo); }
    else idx = Math.min(1.5, idx + passo);
  }
  return idx;
}
function bonusGeneri(prof, film){
  const pos = prof.generiPositivi || [], neg = prof.generiNegativi || [];
  let g = 0;
  for (const gen of (film.generi || [])){ if (pos.includes(gen)) g += 1; else if (neg.includes(gen)) g -= 1; }
  return g;
}
function classificaM(){
  const cfg = cfgSala(), setP = S.presenti, f = S.fSala;
  const candidati = new Map();
  for (const pr of S.profili){
    if (!setP.has(pr.slug)) continue;
    for (const voce of (pr.lista || [])){
      if (!voce.tmdbId || !entryAttiva(voce, pr.slug)) continue;
      let c = candidati.get(voce.tmdbId);
      if (!c){ c = {film:{...voce}, prop:[]}; candidati.set(voce.tmdbId, c); }
      else for (const k of ['durata','regista','voto','trama','posterUrl','sfondoUrl','anno','generi'])
        if (!c.film[k] && voce[k]) c.film[k] = voce[k];
      c.prop.push({slug:pr.slug, desiderio:voce.desiderio || 3, conChi:voce.conChi || [], nonCon:voce.nonCon || []});
    }
  }
  // saghe: di una collezione resta il primo episodio per data d'uscita ancora da vedere
  const primoDiColl = new Map();
  for (const c of candidati.values()){
    const cid = c.film.collezione; if (!cid) continue;
    const prev = primoDiColl.get(cid);
    if (!prev || ordineSaga(c.film) < ordineSaga(prev.film)) primoDiColl.set(cid, c);
  }
  const finali = [...candidati.values()].filter(c => !c.film.collezione || primoDiColl.get(c.film.collezione) === c);

  const esclusi = {vincoli:0, durata:0, genere:0, regista:0};
  const rosa = [];
  for (const c of finali){
    const film = c.film;
    let violato = false;
    for (const p of c.prop){
      if (p.conChi.length && !p.conChi.every(x => setP.has(x))){ violato = true; break; }
      if (p.nonCon.some(x => setP.has(x))){ violato = true; break; }
    }
    if (violato){ esclusi.vincoli++; continue; }
    if (f.durata && film.durata && film.durata > f.durata){ esclusi.durata++; continue; }
    if (f.genere.length && !(film.generi || []).some(g => f.genere.includes(g))){ esclusi.genere++; continue; }
    if (f.regista && !(film.regista || '').toLowerCase().includes(f.regista.toLowerCase())){ esclusi.regista++; continue; }

    const n = c.prop.length;
    const D = c.prop.reduce((s,p) => s + p.desiderio, 0) / n / 5;
    const B = Math.min(1 + cfg.bonusCoralita*(n-1), 1 + cfg.capCoralita);
    let W = 0.5;
    for (const p of c.prop) W = Math.max(W, indiceSoddisfazione(p.slug));
    let M = 1;
    for (const p of c.prop){
      if (!p.conChi.length) continue;
      const attesi = new Set([p.slug, ...p.conChi]);
      if (attesi.size === setP.size && [...setP].every(x => attesi.has(x))){ M = cfg.bonusCoppia; break; }
    }
    let G = 0;
    for (const p of c.prop){ const pr = S.profili.find(x=>x.slug===p.slug); if (pr) G += bonusGeneri(pr, film); }
    rosa.push({film, prop:c.prop, S:D*B*W*M, D, B, W, G, M});
  }
  const top = rosa.reduce((m,r) => Math.max(m, r.S), 0);
  const banda = cfg.sogliaSpareggio * top;
  const bandaDi = s => banda > 0 ? Math.round(s / banda) : 0;
  rosa.sort((a,b) =>
    bandaDi(b.S) - bandaDi(a.S) || (b.G||0) - (a.G||0) ||
    (b.film.voto||0) - (a.film.voto||0) || String(a.film.titolo).localeCompare(b.film.titolo));
  return {rosa:rosa.slice(0,5), tutti:rosa, totale:rosa.length, esclusi};
}

const fmtNum = (n,d=2) => Number(n||0).toLocaleString('it-IT',{minimumFractionDigits:d, maximumFractionDigits:d});
const filtriSalaAttivi = () => !!(S.fSala.durata || S.fSala.genere.length || S.fSala.regista);

function disegnaSalaM(){
  disegnaPlateaM();   // le poltrone in velluto, come sul desktop
  $('#m-conta-pres').textContent = S.presenti.size ? '· '+S.presenti.size : '';
  $('#m-btn-filtri-sala').classList.toggle('attivo', filtriSalaAttivi());

  const schermo = $('#m-schermo'), inner = $('#m-schermo-inner'), stato = $('#m-stato-sala'), btnLC = $('#m-lista-completa');
  const aggiornaLC = n => { if (btnLC){ btnLC.disabled = !n; btnLC.textContent = n ? `📋 Lista completa (${n})` : '📋 Lista completa'; } };
  // schermo.classList `aperto` apre le tende (sipario); l'inner si rifà ad ogni render
  if (!S.presenti.size){
    schermo.classList.remove('aperto');
    inner.innerHTML = '<div class="msg">La sala è vuota…<br><span style="font-size:12px; color:var(--dim)">tocca le poltrone di chi c\'è stasera</span></div>';
    stato.innerHTML = ''; S.tuttiSala = []; aggiornaLC(0);
    return;
  }
  const ris = classificaM();
  S.tuttiSala = ris.tutti;
  aggiornaLC(ris.totale);
  if (S.proiettato && !ris.tutti.some(r => r.film.tmdbId === S.proiettato)) S.proiettato = null;
  const scelto = S.proiettato ? ris.tutti.find(r => r.film.tmdbId === S.proiettato) : ris.tutti[0];

  if (!scelto){
    const e = ris.esclusi;
    const motivi = [e.durata && e.durata+' troppo lunghi', e.genere && e.genere+' di altro genere',
      e.regista && e.regista+' di altri registi', e.vincoli && e.vincoli+' per vincoli di compagnia'].filter(Boolean).join(' · ');
    schermo.classList.remove('aperto');
    inner.innerHTML = `<div class="msg">Niente in cartellone stasera<br><span style="font-size:12px">${esc(motivi || 'le liste dei presenti sono vuote')}</span></div>`;
  } else {
    const f = scelto.film, rango = ris.tutti.indexOf(scelto) + 1;
    const sf = f.sfondoUrl || f.posterUrl || '';
    inner.innerHTML = `
      ${sf ? `<img class="sfondo" src="${esc(sf)}" alt="">` : ''}<div class="velo"></div>
      <div class="rango">${rango}</div>
      <div class="dentro">
        <h4>${esc(f.titolo)}</h4>
        <div class="meta2">${esc(f.anno||'')}${f.durata?' · '+fmtMin(f.durata):''}${f.regista?' · '+esc(f.regista):''}<br>
          🎟 ${scelto.prop.length} ${scelto.prop.length===1?'proponente':'proponenti'} ·
          <span class="punti">🏆 ${fmtNum(scelto.S)}</span>${f.voto?` · ★ ${f.voto}`:''}${scelto.M>1?' · 💛 su misura':''}${rango>1?' · <span style="color:var(--oro2)">dalla lista completa</span>':''}</div>
      </div>
      <button class="play" id="m-play" title="Segna questo film come visto stasera">▶</button>`;
    inner.onclick = () => modaleSchedaM(scelto);
    $('#m-play').onclick = e => { e.stopPropagation(); modalePlayM(scelto); };
    // Sipario: se era chiuso lo apro dopo un attimo, così le tende partono chiuse e si
    // vedono scorrere (transizione CSS). Se era già aperto (cambio film) resta aperto,
    // niente flash. setTimeout e non rAF: scatta anche col tab in background, così il
    // film non resta mai coperto.
    if (!schermo.classList.contains('aperto')) setTimeout(() => schermo.classList.add('aperto'), 60);
  }
  const e = ris.esclusi, fuori = e.durata+e.genere+e.regista+e.vincoli;
  stato.innerHTML = `🎞 ${ris.totale} in cartellone · ${S.presenti.size} in sala
    ${fuori ? `<br><span class="avv">esclusi: ${[e.durata&&e.durata+' per durata', e.genere&&e.genere+' per genere', e.regista&&e.regista+' per regista', e.vincoli&&e.vincoli+' per compagnia'].filter(Boolean).join(', ')}</span>` : ''}
    <br><span style="color:var(--dim)">▶ registra il film come visto per chi è in sala.</span>`;
}

// Registra la visione nello storico condiviso. Come sul desktop: rilegge storico.json
// FRESCO e fonde le voci per `id` (ognuna ha id univoco timestamp+autore), così anche se
// più dispositivi registrano non si perde nulla (SPECIFICA §3.2).
async function registraVisioneM(voce){
  let attuale = {visioni:[]};
  const txt = await fsLeggiPercorso('storico.json');
  if (txt){ try { const j = JSON.parse(txt); if (j && Array.isArray(j.visioni)) attuale = j; } catch(e){} }
  if (!Array.isArray(attuale.visioni)) attuale.visioni = [];
  const ids = new Set(attuale.visioni.map(v => v.id));
  for (const v of S.storico) if (v.id && !ids.has(v.id)){ attuale.visioni.push(v); ids.add(v.id); }
  if (!ids.has(voce.id)) attuale.visioni.push(voce);
  await fsScriviPercorso('storico.json', JSON.stringify(attuale));
  S.storico = attuale.visioni.sort((a,b) => String(a.data||'').localeCompare(String(b.data||'')));
}

// Come sul desktop: scrivo SOLO segnalazioni/<mio slug>.json; stato ed eliminazioni le
// decide l'host in segnalazioni-stato.json (qui si leggono soltanto).
const SEGN_TIPI = {
  bug:         {label:'Bug',          ic:'⚠', desc:'Qualcosa non funziona come dovrebbe'},
  suggerimento:{label:'Suggerimento', ic:'✦', desc:'Una funzione pensata, con un\'idea di come dovrebbe funzionare'},
  idea:        {label:'Idea',         ic:'◌', desc:'Un\'intuizione ancora grezza, ma che potrebbe valere'}
};
const SEGN_GRAVITA = {blocca:'Blocca l\'uso', rallenta:'Dà fastidio', minore:'Dettaglio minore'};
const SEGN_STATI = {nuovo:'Nuova', in_corso:'In lavorazione', fatto:'Fatta', scartato:'Scartata'};

async function caricaSegnalazioniM(){
  S.segnalazioni = [];
  for (const f of await fsElencaJson('segnalazioni')){
    try {
      const d = JSON.parse(f.data);
      const slug = f.nome.replace(/\.json$/,'');
      for (const s of ((d && Array.isArray(d.segnalazioni)) ? d.segnalazioni : []))
        if (s && s.id) S.segnalazioni.push({...s, autore:slug});
    } catch(e){}
  }
  S.segnStato = {}; S.segnEliminate = [];
  const st = await fsLeggiPercorso('segnalazioni-stato.json');
  if (st){ try { const j = JSON.parse(st);
    if (j && j.stato && typeof j.stato === 'object') S.segnStato = j.stato;
    if (j && Array.isArray(j.eliminate)) S.segnEliminate = j.eliminate;
  } catch(e){} }
}
async function salvaMieSegnalazioniM(){
  const mie = S.segnalazioni.filter(s => s.autore === S.me.slug).map(s => { const c = {...s}; delete c.autore; return c; });
  await fsScriviPercorso('segnalazioni/' + S.me.slug + '.json', JSON.stringify({segnalazioni:mie}));
}
const statoSegnM = s => (S.segnStato[s.id] || {}).stato || 'nuovo';

function modaleSegnalaM(){
  if (!S.me) return;
  let tipo = 'bug';
  const contesto = S.pan;
  const mie = S.segnalazioni.filter(s => s.autore === S.me.slug && !S.segnEliminate.includes(s.id));
  apriModale(`
    <h3>🐞 Segnala</h3>
    <p class="meta">Un problema o un'idea per Movienaitor. Finisce nella cartella del gruppo: l'host la vede sul PC e la segna come fatta quando l'ha sistemata.</p>
    <div class="sg-tipi" id="sg-tipi">${Object.keys(SEGN_TIPI).map(k=>`
      <button class="sg-tipo${k===tipo?' on':''}" data-t="${k}">
        <span class="lb">${SEGN_TIPI[k].ic} ${SEGN_TIPI[k].label}</span>
        <span class="ds">${esc(SEGN_TIPI[k].desc)}</span></button>`).join('')}</div>
    <div class="etich">TITOLO</div>
    <input type="text" class="sg-in" id="sg-tit" maxlength="120" placeholder="il problema in una riga…">
    <div class="etich">DESCRIZIONE</div>
    <textarea class="sg-in" id="sg-desc" placeholder="Cosa succede, cosa ti aspettavi, come farlo ricapitare…"></textarea>
    <div id="sg-grav-riga"><div class="etich">QUANTO PESA</div>
      <select class="sg-in" id="sg-grav">${Object.keys(SEGN_GRAVITA).map(g=>`<option value="${g}">${SEGN_GRAVITA[g]}</option>`).join('')}</select></div>
    <div class="meta" style="margin-top:8px; font-size:11.5px">Registro in automatico: sezione «${esc(contesto)}» · app mobile v${APP_VERSION} · ${esc(S.me.nome)}</div>
    <div class="m-az"><button class="ghost" id="sg-annulla">Annulla</button><button class="primario" id="sg-invia">📨 Invia</button></div>
    ${mie.length ? `<div style="margin-top:14px"><div class="etich">LE TUE SEGNALAZIONI</div>${mie.map(s=>`
      <div class="sg-mia"><span>${(SEGN_TIPI[s.tipo]||{ic:'•'}).ic}</span><span class="t">${esc(s.titolo)}</span>
        <span class="sg-chip st-${statoSegnM(s)}">${SEGN_STATI[statoSegnM(s)]}</span>
        <button class="linkbtn" data-togli="${esc(s.id)}" style="padding:2px 4px">ritira</button></div>`).join('')}</div>` : ''}`);
  const agg = () => {
    $('#sg-tipi').querySelectorAll('.sg-tipo').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
    $('#sg-grav-riga').hidden = tipo !== 'bug';
    $('#sg-desc').placeholder = tipo === 'bug'
      ? 'Cosa succede, cosa ti aspettavi, come farlo ricapitare…'
      : tipo === 'suggerimento' ? 'Cosa dovrebbe fare, come dovrebbe funzionare, perché è utile…'
      : 'Butta giù l\'intuizione, anche grezza: a cosa potrebbe servire…';
  };
  $('#sg-tipi').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; tipo = b.dataset.t; agg(); };
  $('#sg-annulla').onclick = chiudiModale;
  $('#sg-invia').onclick = async () => {
    const titolo = $('#sg-tit').value.trim();
    if (!titolo){ toast('Serve almeno un titolo', true); $('#sg-tit').focus(); return; }
    const btn = $('#sg-invia'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    const s = { id:`${Date.now().toString(36)}-${S.me.slug}`, tipo, titolo,
      descrizione:$('#sg-desc').value.trim(), gravita: tipo === 'bug' ? $('#sg-grav').value : null,
      contesto, versione:APP_VERSION+'-mobile', creato:new Date().toISOString(), autore:S.me.slug };
    S.segnalazioni.push(s);
    try { await salvaMieSegnalazioniM(); }
    catch(e){
      S.segnalazioni = S.segnalazioni.filter(x => x !== s);
      btn.disabled = false; btn.textContent = '📨 Invia';
      return toast('Invio non riuscito: '+e.message, true);
    }
    chiudiModale(); toast('Segnalazione inviata, grazie! 🐞');
  };
  $('#modale').querySelectorAll('[data-togli]').forEach(b => b.onclick = async () => {
    const id = b.dataset.togli, prima = S.segnalazioni;
    S.segnalazioni = S.segnalazioni.filter(x => x.id !== id);
    try { await salvaMieSegnalazioniM(); } catch(e){ S.segnalazioni = prima; return toast('Non riuscito: '+e.message, true); }
    toast('Segnalazione ritirata'); modaleSegnalaM();
  });
  agg();
}

/* ══════════════════ AGGIORNAMENTO DELL'APK ══════════════════ */
// Marco pubblica il nuovo APK con "Pubblica APK.bat": finisce in <cartella>/Latest APK/
// insieme a versione.json. L'app se ne accorge e propone di installarlo.
const APK_CARTELLA = 'Latest APK';
// confronto "1.10.0" > "1.9.3" (numerico pezzo per pezzo, non alfabetico)
function versioneMaggiore(a, b){
  const pa = String(a||'0').split('.').map(n=>parseInt(n,10)||0);
  const pb = String(b||'0').split('.').map(n=>parseInt(n,10)||0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++){
    const x = pa[i]||0, y = pb[i]||0;
    if (x !== y) return x > y;
  }
  return false;
}
async function versioneInstallata(){
  try { const r = await saf().versioneApp(); if (r && r.versione) return r.versione; } catch(e){}
  return APP_VERSION;
}
async function controllaAggiornamento(){
  S.aggiornamento = null;
  const box = $('#m-upd'); if (box) box.hidden = true;
  const txt = await fsLeggiPercorso(APK_CARTELLA + '/versione.json');
  if (!txt) return;
  let j; try { j = JSON.parse(txt); } catch(e){ return; }
  if (!j || !j.versione || !j.file) return;
  const corrente = await versioneInstallata();
  if (!versioneMaggiore(j.versione, corrente)) return;
  S.aggiornamento = {...j, corrente};
  if (box){
    box.hidden = false;
    box.innerHTML = `<span class="frecc">↑</span>
      <span class="txt"><b>Aggiornamento disponibile — ${esc(j.versione)}</b>
      <span>hai la ${esc(corrente)}${j.note ? ' · '+esc(String(j.note).slice(0,60)) : ''}</span></span>
      <span class="vai">Installa ›</span>`;
  }
}
function pannelloAggiornamento(){
  const a = S.aggiornamento; if (!a) return;
  apriModale(`
    <h3>Aggiornamento disponibile</h3>
    <div class="campo-r"><label>Versione in uso</label><span>${esc(a.corrente)}</span></div>
    <div class="campo-r"><label>Nuova versione</label><span style="color:var(--oro2)">${esc(a.versione)}</span></div>
    ${a.note ? `<div class="meta" style="margin:8px 0">${esc(a.note)}</div>` : ''}

async function apriImpostazioni(){

  try { const fresh = JSON.parse(await fsLeggi(S.me._uri)); fresh._uri = S.me._uri; S.me = fresh;

      const st = pos.includes(g) ? 'pos' : neg.includes(g) ? 'neg' : '';

      const seg = st==='pos'?'✓ ':st==='neg'?'✗ ':'';
      return `<button class="pchip" data-gen="${esc(g)}"${st?` style="background:${col};border-color:${col};color:#181012;font-weight:600"`:''}>${seg}${esc(g)}</button>`;

    <div class="etich" style="margin-top:6px">Tocca per ciclare: <b style="color:#9bbf90">verde ✓ mi piace</b> · <b style="color:#e08a86">rosso ✗ evita</b></div>
    <div class="compagnia" id="i-gen"></div>
    <div class="etich" style="margin-top:16px">VERSIONE</div>
    <div class="campo-r"><label id="i-ver">Movienaitor mobile v${esc(APP_VERSION)}</label>
      <button class="inp" id="i-agg">Cerca aggiornamenti</button></div>
    <div class="m-az"><button class="primario" id="i-chiudi">Fatto</button></div>`);
  versioneInstallata().then(v => { const el = $('#i-ver'); if (el) el.textContent = 'Movienaitor mobile v'+v; });
  $('#i-agg').onclick = async () => {
    const b = $('#i-agg'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    await controllaAggiornamento();
    b.disabled = false; b.textContent = 'Cerca aggiornamenti';
    if (S.aggiornamento) pannelloAggiornamento();
    else toast('Sei già all\'ultima versione ✓');
  };
  render();
  $('#i-gen').onclick = async e => { const b = e.target.closest('[data-gen]'); if(!b) return; const g = b.dataset.gen;
    try {
      await mutaProfilo(pr => {
        pr.generiPositivi = pr.generiPositivi || []; pr.generiNegativi = pr.generiNegativi || [];
        if (pr.generiPositivi.includes(g)){ pr.generiPositivi = pr.generiPositivi.filter(x=>x!==g); pr.generiNegativi.push(g); }
        else if (pr.generiNegativi.includes(g)){ pr.generiNegativi = pr.generiNegativi.filter(x=>x!==g); }
        else pr.generiPositivi.push(g);

const DOVE_STREAMING = ['Netflix','Prime Video','Disney+','NOW','Sky','RaiPlay','Mediaset Infinity','Apple TV+','YouTube','Crunchyroll','Paramount+','Mubi'];
const DOVE_FISICO = ['DVD','Blu-ray','4K UHD'];
const testoHTML = t => { t = t||''; return /<[a-z][\s\S]*>/i.test(t) ? t : esc(t).replace(/\n/g,'<br>'); };
const doveChipM = (label, kind, on) => `<button type="button" class="pchip${on?' con':''}" data-dove="${kind}" data-val="${esc(label)}">${on?'✓ ':''}${esc(label)}</button>`;
function doveTestoM(d){ d=d||{}; const p=[...(d.streaming||[]),...(d.fisico||[])]; let s=p.map(x=>`<span class="pchip con" style="pointer-events:none">${esc(x)}</span>`).join(' '); if(d.percorso) s+=` <span class="pchip">📂 ${esc((d.percorso.split(/[\\/]/).pop())||d.percorso)}</span>`; return s?('📺 '+s):''; }
const miaRecMobile = id => S.recensioni.find(r => r.autore===S.me.slug && r.tmdbId===id);

function setPan(pan){
  S.pan = pan;
  $('#pan-sala').hidden = pan!=='sala';
  $('#pan-lista').hidden = pan!=='lista';
  $('#pan-recensioni').hidden = pan!=='recensioni';
  document.querySelectorAll('#segmenti .seg').forEach(b=>b.classList.toggle('on', b.dataset.pan===pan));
  if (pan==='recensioni') disegnaRecMobile();
  if (pan==='sala') disegnaSalaM();
  $('#hdr-sub').textContent = pan==='sala' ? 'la serata' : pan==='recensioni' ? 'le recensioni' : 'la tua lista';
}
function recFiltrateM(slug){
  const f=S.recFiltri; let out=S.recensioni.filter(r=>r.autore===slug);
  if(f.q) out=out.filter(r=>String((r.meta||{}).titolo||'').toLowerCase().includes(f.q.toLowerCase()));
  const cmp={modificato:(a,b)=>String(a.modificato||'').localeCompare(String(b.modificato||'')),ultimaVisione:(a,b)=>String(a.ultimaVisione||'').localeCompare(String(b.ultimaVisione||'')),votoPersonale:(a,b)=>(a.votoPersonale||0)-(b.votoPersonale||0),titolo:(a,b)=>String((a.meta||{}).titolo||'').localeCompare(String((b.meta||{}).titolo||'')),anno:(a,b)=>(parseInt((a.meta||{}).anno,10)||0)-(parseInt((b.meta||{}).anno,10)||0)}[f.ordina]||(()=>0);
  out.sort((a,b)=>cmp(a,b)||String((a.meta||{}).titolo||'').localeCompare(String((b.meta||{}).titolo||'')));
  if(f.dir==='desc') out.reverse();
  out=[...out.filter(r=>r.inCorso), ...out.filter(r=>!r.inCorso)];   // "in corso" sempre in cima
  return out;
}
function filmVistiNonRecM(){
  const recIds=new Set(S.recensioni.filter(r=>r.autore===S.me.slug && r.tmdbId!=null).map(r=>r.tmdbId));
  const m=new Map();
  for(const v of S.storico) if((v.partecipanti||[]).includes(S.me.slug) && v.tmdbId!=null && !recIds.has(v.tmdbId)) m.set(v.tmdbId,v.titolo);
  return [...m.entries()].map(([tmdbId,titolo])=>({tmdbId,titolo}));
}
function disegnaRecMobile(){
  if(!$('#m-rec-galleria')) return;
  const autori=[...new Set(S.recensioni.map(r=>r.autore))];
  const utenti=[S.me.slug, ...autori.filter(a=>a!==S.me.slug)].filter(s=>S.profili.some(p=>p.slug===s));

  $('#m-rec-utenti').innerHTML=utenti.map(s=>{const p=S.profili.find(x=>x.slug===s);return `<button class="rec-utente${s===sel?' on':''}" data-u="${esc(s)}"><span class="pallino2" style="background:${p?(p.colore||'#c9a45c'):'#c9a45c'}"></span>${esc(nomeDi(s))}${s===S.me.slug?' (io)':''}</button>`;}).join('');
  const mio=sel===S.me.slug;
  $('#m-rec-nuova').style.display=mio?'':'none';
  const box=$('#m-rec-visti-box'); const nr=mio?filmVistiNonRecM():[];
  if(nr.length){ box.style.display=''; box.querySelector('summary').textContent=`🎬 Film visti non recensiti (${nr.length})`;
    $('#m-rec-visti').innerHTML=nr.map(f=>`<button class="rec-nr" data-id="${f.tmdbId}">${esc(f.titolo)}</button>`).join('');
    $('#m-rec-visti').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>avviaEditorDaTMDBM(parseInt(b.dataset.id,10)));
  } else box.style.display='none';
  const so=$('#m-rec-ordina'); if(so) so.value=S.recFiltri.ordina;
  const lista=recFiltrateM(sel); const g=$('#m-rec-galleria');
  if(!lista.length){ g.innerHTML=`<div class="rec-vuoto">${mio?'Non hai ancora recensioni.<br>Tocca «✍ Nuova».':esc(nomeDi(sel))+' non ha recensioni.'}</div>`; return; }
  g.innerHTML=lista.map((r,i)=>{const m=r.meta||{};const pst=m.posterUrl||'';return `<div class="rec-card2${r.inCorso?' in-corso':''}" data-i="${i}">
    <div class="rec-poster2">${pst?`<img src="${esc(pst)}" loading="lazy" alt="">`:`<div class="seg2">${esc(m.titolo||'')}</div>`}${r.inCorso?'<div class="rec-incorso-b">✍</div>':''}${r.votoPersonale?`<div class="rec-voto-b">${stelleLetterbox(r.votoPersonale)}</div>`:''}</div>
    <div class="corpo"><h5>${esc(m.titolo||'Film')}</h5><div class="sub2">${esc(m.anno||'')}</div></div></div>`;}).join('');
  lista.forEach((r,i)=>{const el=g.querySelector(`.rec-card2[data-i="${i}"]`); if(el) el.onclick=()=>editorRecMobile(r);});

function sezioneHTMLm(s,i,ed){

        <button class="cambia" id="m-re-chiudi" style="font-size:18px">✕</button>

      ${ed

      const box=$('#m-re-strm'); if(!box) return;
      box.innerHTML=DOVE_STREAMING.map(x=>doveChipM(x,'streaming',(dv.streaming||[]).includes(x))).join('');
      clic('#m-re-strm','streaming');
      if(!silenzioso) toast('Rilevati: '+noti.join(', ')+' 📺');
    };
    if($('#m-re-rileva')) $('#m-re-rileva').onclick=()=>rilevaStreaming(false);
    if(!streamRilevato && bozza.tmdbId!=null && !(dv.streaming||[]).length){ streamRilevato=true; rilevaStreaming(true); }
    if($('#m-re-collega')) $('#m-re-collega').onclick=()=>{ leggiCampi(); modaleCercaFilmM(id=>collegaTMDBM(bozza,id), {titolo:bozza.tmdbId!=null?'Cambia film':'Collega a TMDB', query:(bozza.meta||{}).titolo||''}); };
    $('#m-re-add-sez').onclick=()=>{ leggiCampi(); bozza.sezioni.push({titolo:'Nuova sezione',testo:''}); render(); };
    $('#m-re-sezioni').querySelectorAll('[data-az]').forEach(b=>b.onclick=()=>{ leggiCampi(); const i=+b.dataset.i, az=b.dataset.az; if(az==='del') bozza.sezioni.splice(i,1); else if(az==='su'&&i>0)[bozza.sezioni[i-1],bozza.sezioni[i]]=[bozza.sezioni[i],bozza.sezioni[i-1]]; else if(az==='giu'&&i<bozza.sezioni.length-1)[bozza.sezioni[i+1],bozza.sezioni[i]]=[bozza.sezioni[i],bozza.sezioni[i+1]]; render(); });
    $('#m-re-salva').onclick=async()=>{ leggiCampi(); if(!voto && !bozza.sezioni.some(s=>(s.testo||'').replace(/<[^>]*>/g,'').trim())){ toast('Metti un voto o del testo',true); return; }
      $('#m-re-salva').disabled=true; $('#m-re-salva').innerHTML='<span class="spin"></span>';
      try { await salvaRecensioneMobile(bozza); chiudiModale(); disegnaRecMobile(); toast('Recensione salvata 🎞'); }
      catch(e){ $('#m-re-salva').disabled=false; $('#m-re-salva').textContent='Salva'; toast('Salvataggio non riuscito: '+e.message,true); } };
    if($('#m-re-del')) $('#m-re-del').onclick=()=>{ apriModale(`<h3>Eliminare?</h3><p class="meta">La recensione di «${esc(m.titolo)}» sarà rimossa.</p><div class="m-az"><button class="ghost" id="d-no">Annulla</button><button class="primario" id="d-si">Elimina</button></div>`);
      $('#d-no').onclick=()=>editorRecMobile(bozza); $('#d-si').onclick=async()=>{ try{ await cancellaRecensioneMobile(bozza); chiudiModale(); disegnaRecMobile(); toast('Recensione eliminata'); }catch(e){ toast('Non riuscito: '+e.message,true);} }; };
  }
  render();
}
function modaleCercaFilmM(onScegli, opts={}){
  apriModale(`<h3>${esc(opts.titolo||'Cerca film')}</h3>
    <input type="text" id="rnm-q" class="pw-in" placeholder="Titolo del film…" autocomplete="off">
    <div id="rnm-ris" style="max-height:50vh;overflow:auto;margin-top:8px"></div>
    <div class="m-az"><button class="ghost" id="rnm-x">Annulla</button></div>`);
  $('#rnm-x').onclick=chiudiModale; let t=null;
  const cerca=()=>{ clearTimeout(t); const q=$('#rnm-q').value.trim(); if(q.length<2){$('#rnm-ris').innerHTML='';return;}
    t=setTimeout(async()=>{ try{ const res=await cercaFilm(q);
      $('#rnm-ris').innerHTML=res.map(f=>`<div class="rn-item" data-id="${f.id}">${f.poster_path?`<img src="https://image.tmdb.org/t/p/w92${f.poster_path}">`:'<div class="rn-mini"></div>'}<div><div>${esc(f.title)}</div><div style="color:var(--dim);font-size:12px">${(f.release_date||'').slice(0,4)}</div></div></div>`).join('')||'<div style="color:var(--dim);padding:8px">Nessun risultato</div>';
      $('#rnm-ris').querySelectorAll('.rn-item').forEach(el=>el.onclick=()=>onScegli(parseInt(el.dataset.id,10)));
    }catch(e){ $('#rnm-ris').innerHTML=`<div style="color:var(--dim);padding:8px">${e.message==='nokey'?'Manca la chiave TMDB':'Ricerca non riuscita'}</div>`; } },350); };
  $('#rnm-q').oninput=cerca; if(opts.query){ $('#rnm-q').value=opts.query; cerca(); }
  setTimeout(()=>$('#rnm-q').focus(),50);
}
async function avviaEditorDaTMDBM(id){
  const mia=miaRecMobile(id); if(mia) return editorRecMobile(mia);
  apriModale('<h3>Un attimo…</h3><p class="meta"><span class="spin"></span> recupero il film</p>');
  let d; try{ d=await dettagliFilm(id); }catch(e){ return toast('Scheda non recuperata',true); }
  const rec={ tmdbId:d.tmdbId, votoPersonale:0, doveVederlo:{streaming:[],fisico:[],percorso:''}, ultimaVisione:ultimaVisioneMia(d.tmdbId)||new Date().toISOString().slice(0,10),
    meta:{ titolo:d.titolo, anno:d.anno, generi:d.generi, regista:d.regista, durata:d.durata, paese:d.paese||'', cast:d.cast||[], voto:d.voto, votoFonte:d.votoFonte, locandina:d.locandina, posterUrl:d.posterUrl },
    sezioni: SEZIONI_DEFAULT.map(tt=>({titolo:tt,testo:''})), link:[] };
  editorRecMobile(rec,{nuova:true});
}
async function collegaTMDBM(bozza,id){
  apriModale('<h3>Un attimo…</h3><p class="meta"><span class="spin"></span> recupero il film</p>');
  let d; try{ d=await dettagliFilm(id); }catch(e){ return toast('Scheda non recuperata',true); }
  bozza.tmdbId=d.tmdbId;
  bozza.meta={ titolo:d.titolo, anno:d.anno, generi:d.generi, regista:d.regista, durata:d.durata, paese:d.paese||'', cast:d.cast||[], voto:d.voto, votoFonte:d.votoFonte, locandina:d.locandina, posterUrl:d.posterUrl };
  editorRecMobile(bozza,{nuova:!bozza.creato}); toast('Film collegato 🎬');
}

async function scegliECarica(){
  if (!inApp()){ $('#cartella-nota').innerHTML='Questa è la versione app: aprila come APK installato (nel browser il selettore di sistema non è disponibile).'; return; }
  const btn = $('#btn-scegli'); btn.disabled=true; const t=btn.textContent; btn.innerHTML='<span class="spin"></span> …';
  $('#cartella-nota').textContent='';
  try {
    const uri = await pickFolder();
    if (!uri){ return; }             // annullato
    btn.innerHTML='<span class="spin"></span> apro la cartella…';
    await caricaCartella(uri);
  } catch(e){ $('#cartella-nota').textContent = 'Non riuscito: ' + (e.message||e); }
  finally { btn.disabled=false; btn.textContent=t; }
}
$('#btn-scegli').onclick = scegliECarica;

(async function init(){
  if (!inApp()){
    $('#cartella-nota').innerHTML = 'Anteprima nel browser: il selettore cartelle funziona solo nell\'APK installato.';
    return;
  }
  const saved = LS.get('tree');
  if (saved){
    $('#cartella-nota').innerHTML = '<span class="spin"></span> riapro l\'ultima cartella…';
    try { await caricaCartella(saved); }
    catch(e){ $('#cartella-nota').innerHTML = 'Tocca <b>Scegli cartella</b> per riaprirla (permesso scaduto o cartella spostata).'; }
  }
})();
